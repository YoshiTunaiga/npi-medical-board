[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "vite"
  port = 3000
  targetPort = 5173

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"